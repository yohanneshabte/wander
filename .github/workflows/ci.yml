name: CI

on:
  pull_request:
    branches: [main, alpha-0.3]
  push:
    branches: [main, alpha-0.3]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Privacy: this workflow does not log environment variables,
      # does not upload artifacts containing user data, and does not
      # call external services that could leak repository content.
